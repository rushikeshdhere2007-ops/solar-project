<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Storm AI — Operator Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* ============================================================
           ROOT TOKENS
           ============================================================ */
        :root {
            --bg-dark: #020410;
            --panel-bg: rgba(8, 14, 40, 0.88);
            --cyan: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.18);
            --orange: #ff6847;
            --amber: #ffb347;
            --green: #43ff87;
            --red: #ff3b5c;
            --text: #e2e8ff;
            --muted: #7a88b8;
            --heading: 'Space Grotesk', sans-serif;
            --body: 'Inter', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Orbitron', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: var(--body);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ============================================================
           3D CANVAS BACKGROUND
           ============================================================ */
        #scene-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
        }

        /* CRT scan lines */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.12) 0px,
                rgba(0,0,0,0.12) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        /* Floating hex-grid overlay */
        .hex-grid {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='52' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon fill='none' stroke='%2300f0ff' stroke-width='0.5' points='30,2 56,15 56,37 30,50 4,37 4,15'/%3E%3C/svg%3E");
            background-size: 60px 52px;
        }

        /* ============================================================
           LOGIN CONTAINER — 3D GLASS CARD
           ============================================================ */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .login-card {
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--cyan-dim);
            border-radius: 32px;
            padding: 44px 40px 36px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 40px 100px rgba(0,0,0,0.7),
                0 0 60px rgba(0,240,255,0.08),
                inset 0 1px 0 rgba(255,255,255,0.06);
            transition: transform 0.2s ease-out, box-shadow 0.4s ease;
        }

        /* Animated top border gradient */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--orange), var(--cyan), transparent);
            background-size: 400% 100%;
            animation: borderSlide 6s linear infinite;
        }

        @keyframes borderSlide {
            0%   { background-position: 0% 0; }
            100% { background-position: 400% 0; }
        }

        /* Corner HUD brackets */
        .login-card::after {
            content: '';
            position: absolute;
            top: 14px; left: 14px;
            width: 14px; height: 14px;
            border-top: 2px solid var(--cyan);
            border-left: 2px solid var(--cyan);
            pointer-events: none;
        }

        .corner-br {
            position: absolute;
            bottom: 14px; right: 14px;
            width: 14px; height: 14px;
            border-bottom: 2px solid var(--cyan);
            border-right: 2px solid var(--cyan);
        }

        .corner-tr {
            position: absolute;
            top: 14px; right: 14px;
            width: 14px; height: 14px;
            border-top: 2px solid var(--orange);
            border-right: 2px solid var(--orange);
            opacity: 0.5;
        }

        .corner-bl {
            position: absolute;
            bottom: 14px; left: 14px;
            width: 14px; height: 14px;
            border-bottom: 2px solid var(--orange);
            border-left: 2px solid var(--orange);
            opacity: 0.5;
        }

        /* ============================================================
           HEADER: SHIELD ICON + TITLES
           ============================================================ */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .shield-wrapper {
            width: 80px; height: 80px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.12) 0%, transparent 70%);
            border: 2px solid var(--cyan-dim);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: shieldPulse 3s ease-in-out infinite;
        }

        @keyframes shieldPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0,240,255,0.2); }
            50%      { box-shadow: 0 0 40px rgba(0,240,255,0.45); }
        }

        .shield-wrapper i {
            font-size: 32px;
            color: var(--cyan);
            filter: drop-shadow(0 0 10px rgba(0,240,255,0.8));
        }

        /* Rotating orbit ring */
        .shield-wrapper::before {
            content: '';
            position: absolute;
            inset: -8px;
            border: 1px dashed rgba(0,240,255,0.25);
            border-radius: 50%;
            animation: orbitSpin 12s linear infinite;
        }

        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .auth-title {
            font-family: var(--display);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* System status bar under header */
        .system-status-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 14px;
        }

        .sys-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--muted);
        }

        .sys-tag .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%,100% { opacity: 1; }
            50%     { opacity: 0.4; }
        }

        /* ============================================================
           TAB SWITCH
           ============================================================ */
        .tabs {
            display: flex;
            background: rgba(4,8,24,0.9);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 26px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: var(--heading);
            font-size: 12px;
            font-weight: 700;
            padding: 11px 10px;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--cyan), #0080ff);
            color: var(--bg-dark);
            box-shadow: 0 0 18px rgba(0,240,255,0.4);
        }

        /* ============================================================
           FORM INPUTS
           ============================================================ */
        .form-block { display: flex; flex-direction: column; gap: 18px; }
        .form-block.hidden { display: none; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field label i { color: var(--cyan); font-size: 13px; }

        .field input {
            background: rgba(4,8,26,0.92);
            border: 1px solid rgba(0,240,255,0.2);
            border-radius: 14px;
            padding: 14px 18px;
            color: #ffffff;
            font-family: var(--mono);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .field input::placeholder {
            color: rgba(142,156,200,0.5);
            font-family: var(--body);
            font-weight: 500;
        }

        .field input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 25px rgba(0,240,255,0.2), inset 0 0 20px rgba(0,240,255,0.04);
        }

        /* ============================================================
           CREDENTIALS HINT
           ============================================================ */
        .cred-hint {
            background: rgba(0,240,255,0.05);
            border: 1px dashed rgba(0,240,255,0.25);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 11px;
            color: var(--text);
            line-height: 1.8;
        }

        .cred-hint code {
            background: rgba(0,0,0,0.5);
            color: var(--cyan);
            padding: 2px 7px;
            border-radius: 5px;
            font-family: var(--mono);
            font-size: 12px;
        }

        .cred-hint strong { color: var(--amber); }

        /* ============================================================
           SUBMIT BUTTON
           ============================================================ */
        .btn-submit {
            width: 100%;
            min-height: 54px;
            margin-top: 6px;
            background: linear-gradient(135deg, #ff5a36, #ff8b35, #ff4e67, #ff5a36);
            background-size: 300% 100%;
            border: none;
            border-radius: 16px;
            color: white;
            font-family: var(--heading);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(255,90,50,0.4);
            transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
            animation: gradientMove 4s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn-submit:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 18px 50px rgba(255,90,50,0.55);
        }

        .btn-submit:hover::after { opacity: 1; }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================================
           MESSAGE BOX
           ============================================================ */
        .msg-box {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .msg-box.show { display: block; animation: fadeIn 0.3s ease; }

        .msg-box.error {
            background: rgba(255,59,92,0.12);
            border: 1px solid rgba(255,59,92,0.4);
            color: var(--red);
        }

        .msg-box.success {
            background: rgba(67,255,135,0.12);
            border: 1px solid rgba(67,255,135,0.35);
            color: var(--green);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           DIVIDER & GUEST BUTTON
           ============================================================ */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 16px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,240,255,0.2), transparent);
        }

        .btn-guest {
            width: 100%;
            padding: 13px;
            background: transparent;
            border: 1px solid rgba(0,240,255,0.2);
            border-radius: 14px;
            color: var(--cyan);
            font-family: var(--heading);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-guest:hover {
            background: rgba(0,240,255,0.08);
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0,240,255,0.15);
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            color: rgba(122,136,184,0.5);
            letter-spacing: 1.5px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .login-card { padding: 32px 22px 28px; border-radius: 24px; }
            .auth-title { font-size: 18px; letter-spacing: 2px; }
            .shield-wrapper { width: 64px; height: 64px; }
            .shield-wrapper i { font-size: 26px; }
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--orange), var(--cyan)); border-radius: 6px; }

        ::selection { background: rgba(0,240,255,0.2); color: #fff; }
    </style>
</head>

<body>

    <!-- 3D WebGL Background -->
    <canvas id="scene-canvas"></canvas>
    <div class="scanlines"></div>
    <div class="hex-grid"></div>

    <!-- Login Card -->
    <div class="login-wrapper">
        <div class="login-card" id="login-card">
            <div class="corner-br"></div>
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>

            <!-- Header -->
            <div class="auth-header">
                <div class="shield-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="auth-title">SOLAR STORM AI</div>
                <div class="auth-subtitle">OPERATOR AUTHENTICATION TERMINAL</div>
                <div class="system-status-bar">
                    <span class="sys-tag"><span class="dot"></span> BACKEND ONLINE</span>
                    <span class="sys-tag"><span class="dot" style="background:#ffb347;box-shadow:0 0 6px #ffb347;"></span> OMNI-2 SYNCED</span>
                    <span class="sys-tag"><span class="dot" style="background:#ff6847;box-shadow:0 0 6px #ff6847;"></span> ENCRYPTED</span>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" id="tab-login">
                    <i class="fa-solid fa-right-to-bracket"></i>&nbsp; OPERATOR LOGIN
                </button>
                <button class="tab-btn" id="tab-register">
                    <i class="fa-solid fa-user-plus"></i>&nbsp; REGISTER
                </button>
            </div>

            <!-- Login Form -->
            <form class="form-block" id="form-login">
                <div class="field">
                    <label><i class="fa-solid fa-user-astronaut"></i> OPERATOR ID</label>
                    <input type="text" id="l-user" placeholder="e.g. admin" autocomplete="username" required>
                </div>
                <div class="field">
                    <label><i class="fa-solid fa-fingerprint"></i> SECURITY PASSCODE</label>
                    <input type="password" id="l-pass" placeholder="Enter passcode" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-submit" id="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i> LOG IN
                </button>
            </form>

            <!-- Register Form -->
            <form class="form-block hidden" id="form-register">
                <div class="field">
                    <label><i class="fa-solid fa-id-badge"></i> FULL OPERATOR NAME</label>
                    <input type="text" id="r-name" placeholder="e.g. Rushi Dhere" required>
                </div>
                <div class="field">
                    <label><i class="fa-solid fa-user-astronaut"></i> DESIRED OPERATOR ID</label>
                    <input type="text" id="r-user" placeholder="e.g. rushi2026" autocomplete="username" required>
                </div>
                <div class="field">
                    <label><i class="fa-solid fa-fingerprint"></i> CREATE SECURITY PASSCODE</label>
                    <input type="password" id="r-pass" placeholder="Create a passcode" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn-submit" id="btn-register">
                    <i class="fa-solid fa-user-shield"></i> REGISTER &amp; ENTER SYSTEM
                </button>
            </form>

            <!-- Message -->
            <div class="msg-box" id="msg-box"></div>

            <!-- Divider & Guest -->
            <div class="divider">OR CONTINUE AS</div>
            <button class="btn-guest" id="btn-guest">
                <i class="fa-solid fa-eye"></i> PUBLIC GUEST OBSERVER MODE
            </button>

            <!-- Footer -->
            <div class="login-footer">DEVELOPED BY RUSHI DHERE &nbsp;•&nbsp; NASA OMNI SPACE WEATHER INTELLIGENCE</div>
        </div>
    </div>

    <script>
    // ============================================================
    // THREE.JS 3D SCENE — ROTATING SOLAR SYSTEM
    // ============================================================
    (function() {
        const canvas = document.getElementById('scene-canvas');
        if (!canvas || typeof THREE === 'undefined') return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Sun core
        const sunGeo = new THREE.SphereGeometry(3, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xff6030, transparent: true, opacity: 0.7 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(-18, 8, -15);
        scene.add(sun);

        // Sun glow
        const glowGeo = new THREE.SphereGeometry(4.5, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xff8040, transparent: true, opacity: 0.15 });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.copy(sun.position);
        scene.add(glow);

        // Earth wireframe
        const earthGeo = new THREE.IcosahedronGeometry(4.5, 3);
        const earthMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.2 });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(14, -4, -10);
        scene.add(earth);

        // Magnetosphere ring
        const ringGeo = new THREE.TorusGeometry(6.5, 0.15, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.15 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.copy(earth.position);
        ring.rotation.x = Math.PI / 2.5;
        scene.add(ring);

        // Solar wind particles
        const pCount = 600;
        const pGeo = new THREE.BufferGeometry();
        const pos = new Float32Array(pCount * 3);
        const vel = new Float32Array(pCount);

        for (let i = 0; i < pCount; i++) {
            pos[i*3]     = (Math.random() - 0.5) * 100;
            pos[i*3 + 1] = (Math.random() - 0.5) * 60;
            pos[i*3 + 2] = (Math.random() - 0.5) * 50;
            vel[i] = 0.06 + Math.random() * 0.15;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const pMat = new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.3, transparent: true, opacity: 0.55 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // Background star dust
        const sCount = 400;
        const sGeo = new THREE.BufferGeometry();
        const sPos = new Float32Array(sCount * 3);
        for (let i = 0; i < sCount; i++) {
            sPos[i*3]     = (Math.random() - 0.5) * 120;
            sPos[i*3 + 1] = (Math.random() - 0.5) * 80;
            sPos[i*3 + 2] = -20 - Math.random() * 40;
        }
        sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
        const sMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.4 });
        scene.add(new THREE.Points(sGeo, sMat));

        // Mouse parallax
        let mx = 0, my = 0;
        document.addEventListener('mousemove', (e) => {
            mx = (e.clientX / window.innerWidth - 0.5) * 2;
            my = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function animate() {
            requestAnimationFrame(animate);

            sun.rotation.y += 0.005;
            glow.scale.setScalar(1 + Math.sin(Date.now() * 0.002) * 0.08);
            earth.rotation.y += 0.004;
            earth.rotation.x += 0.001;
            ring.rotation.z -= 0.003;

            camera.position.x += (mx * 4 - camera.position.x) * 0.03;
            camera.position.y += (-my * 3 - camera.position.y) * 0.03;
            camera.lookAt(0, 0, -5);

            const posArr = particles.geometry.attributes.position.array;
            for (let i = 0; i < pCount; i++) {
                posArr[i*3] += vel[i];
                if (posArr[i*3] > 50) posArr[i*3] = -50;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    })();

    // ============================================================
    // 3D CARD TILT — MOUSE FOLLOW
    // ============================================================
    (function() {
        const card = document.getElementById('login-card');
        if (!card) return;

        card.addEventListener('mousemove', (e) => {
            const r = card.getBoundingClientRect();
            const cx = r.width / 2, cy = r.height / 2;
            const rx = ((e.clientY - r.top - cy) / cy) * -6;
            const ry = ((e.clientX - r.left - cx) / cx) * 6;
            card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.01,1.01,1.01)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(900px) rotateX(0) rotateY(0) scale3d(1,1,1)';
        });
    })();

    // ============================================================
    // AUTH REDIRECT CHECK
    // ============================================================
    (function() {
        const token = localStorage.getItem('solar_auth_token');
        if (token) {
            fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(r => r.json())
                .then(d => { if (d.success) window.location.href = '/dashboard'; })
                .catch(() => {});
        }
    })();

    // ============================================================
    // TAB SWITCHING
    // ============================================================
    const tabLogin    = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin   = document.getElementById('form-login');
    const formReg     = document.getElementById('form-register');
    const msgBox      = document.getElementById('msg-box');

    tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        formLogin.classList.remove('hidden');
        formReg.classList.add('hidden');
        hideMsg();
    });

    tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        formReg.classList.remove('hidden');
        formLogin.classList.add('hidden');
        hideMsg();
    });

    function showMsg(text, type) {
        msgBox.className = 'msg-box show ' + type;
        msgBox.textContent = text;
    }
    function hideMsg() {
        msgBox.className = 'msg-box';
    }

    // ============================================================
    // LOGIN
    // ============================================================
    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> VERIFYING CLEARANCE...';
        hideMsg();

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('l-user').value,
                    password: document.getElementById('l-pass').value
                })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('solar_auth_token', data.token);
                showMsg('ACCESS GRANTED — Welcome, ' + data.user.name + ' (' + data.user.role + ')', 'success');
                setTimeout(() => { window.location.href = '/dashboard'; }, 800);
            } else {
                showMsg('ACCESS DENIED — ' + (data.error || 'Invalid credentials'), 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> LOG IN';
            }
        } catch (err) {
            showMsg('NETWORK ERROR — Cannot reach authentication server', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> LOG IN';
        }
    });

    // ============================================================
    // REGISTER
    // ============================================================
    formReg.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-register');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> REGISTERING OPERATOR...';
        hideMsg();

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('r-name').value,
                    username: document.getElementById('r-user').value,
                    password: document.getElementById('r-pass').value
                })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('solar_auth_token', data.token);
                showMsg('OPERATOR REGISTERED — Welcome, ' + data.user.name, 'success');
                setTimeout(() => { window.location.href = '/dashboard'; }, 800);
            } else {
                showMsg('REGISTRATION FAILED — ' + (data.error || 'Unknown error'), 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-shield"></i> REGISTER & ENTER SYSTEM';
            }
        } catch (err) {
            showMsg('NETWORK ERROR — Cannot reach authentication server', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-user-shield"></i> REGISTER & ENTER SYSTEM';
        }
    });

    // ============================================================
    // GUEST ACCESS
    // ============================================================
    document.getElementById('btn-guest').addEventListener('click', () => {
        localStorage.removeItem('solar_auth_token');
        window.location.href = '/dashboard';
    });
    </script>
</body>
</html>
